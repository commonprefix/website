{{define "head"}}{{end}}
{{define "content"}}
<main class="coder">
	<section>
		<h1 class="coder__title">Common Prefix <span class="coder__accent">Coder</span></h1>
		<p class="coder__tagline">
			Vibe-code and vibe-prove your mission-critical software works, from inception to production.
		</p>
		<video
			class="coder__video"
			src="/static/coder/coder.mp4"
			poster="/static/coder/poster.jpg"
			autoplay
			muted
			loop
			playsinline
			controls
			preload="metadata"
		></video>
		<div class="hero-cta">
			<a
				href="mailto:hello@commonprefix.com?subject=Partnership%20inquiry"
				class="with-arrow mbtn mbtn-fit mbtn-primary with-arrow-beige"
			>
				<span class="un">Join the waiting list</span>
			</a>
		</div>
	</section>

	<section>
		<h2 class="coder__heading">Built for mission-critical systems</h2>
		<div class="domains">
			<div class="domains__item">
				<img src="/static/coder/finance.svg" alt="" draggable="false" />
				<h3>Finance</h3>
			</div>
			<div class="domains__item">
				<img src="/static/coder/biomedical.svg" alt="" draggable="false" />
				<h3>Biomedical</h3>
			</div>
			<div class="domains__item">
				<img src="/static/coder/automotive.svg" alt="" draggable="false" />
				<h3>Automotive</h3>
			</div>
			<div class="domains__item">
				<img src="/static/coder/space-aviation.svg" alt="" draggable="false" />
				<h3>Space &amp; Aviation</h3>
			</div>
			<div class="domains__item">
				<img src="/static/coder/robotics.svg" alt="" draggable="false" />
				<h3>Robotics</h3>
			</div>
		</div>
	</section>
</main>
{{end}}
